name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_site:
        description: Rebuild dist with Slamhaus before deploying (optional)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: slamhaus-${{ matrix.os }}
          path: slamhaus-*.zip

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-san -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-san --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-san --output-on-failure

  wasm:
    name: WebAssembly SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build Slamhaus
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF && cmake --build build --parallel 2
      - name: Install pinned Emscripten
        run: ./build/slamhaus toolchain install
      - name: Build repository example through Emscripten
        run: ./build/slamhaus build . -o wasm-output
      - name: Check generated module sizes
        shell: bash
        run: test $(wc -c < wasm-output/modules/index.js) -le 20000 && test $(wc -c < wasm-output/modules/index.wasm) -le 125000

  browser:
    name: Generated browser behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Slamhaus
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF && cmake --build build --parallel 2
      - name: Install pinned Emscripten and generate complete example
        run: ./build/slamhaus toolchain install && ./build/slamhaus examples browser-fixture --profile complete && ./build/slamhaus build browser-fixture
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci && npx playwright install --with-deps chromium firefox webkit
      - name: Run browser tests
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory browser-fixture/dist &
          server=$!
          trap 'kill "$server"' EXIT
          SLAMHAUS_TEST_URL=http://127.0.0.1:4173/ \
            SLAMHAUS_TEST_BASE_PATH=/ npm test --prefix tests/browser
          kill "$server"
          wait "$server" || true
          python3 - <<'PY'
          from pathlib import Path
          config = Path("browser-fixture/slamhaus.yaml")
          text = config.read_text()
          text = text.replace("site:\n", "site:\n  base_path: /Slamhaus/\n", 1)
          config.write_text(text)
          PY
          ./build/slamhaus build browser-fixture
          rm -rf browser-fixture-nested
          mkdir -p browser-fixture-nested/Slamhaus
          cp -a browser-fixture/dist/. browser-fixture-nested/Slamhaus/
          python3 -m http.server 4173 --bind 127.0.0.1 \
            --directory browser-fixture-nested &
          server=$!
          trap 'kill "$server"' EXIT
          SLAMHAUS_TEST_URL=http://127.0.0.1:4173/Slamhaus/ \
            SLAMHAUS_TEST_BASE_PATH=/Slamhaus/ npm test --prefix tests/browser

  deploy-pages:
    name: Deploy committed dist (recommended)
    needs: [test]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify committed website artifact
        run: test -f dist/index.html && test -f dist/api/index.html
      - name: Rebuild site in Actions (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_site == true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build --target slamhaus --parallel 2
          ./build/slamhaus toolchain install
          ./scripts/build-pages.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, sanitizers, wasm, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches VERSION
        shell: bash
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: slamhaus-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: slamhaus-*.zip
