<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Editor</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; display: flex; gap: 20px; }
        .column { flex: 1; display: flex; flex-direction: column; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="color"], input[type="text"] { width: 100%; padding: 8px; }
        iframe { border: 1px solid #ccc; flex-grow: 1; min-height: 500px; }
        button { padding: 10px 20px; background: #333; color: #fff; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background: #555; }
    </style>
</head>
<body>
    <div class="column">
        <h2>Theme Controls</h2>
        <div id="controls">Loading...</div>
        <button id="save-btn">Save Theme</button>
    </div>
    <div class="column" style="flex: 2;">
        <h2>Preview</h2>
        <iframe id="preview-frame" src="/preview/index.html"></iframe>
    </div>

    <script type="module" src="/tools/theme-editor/editor.js"></script>
    <script type="module">
       import { Init } from '/tools/theme-editor/editor.js';
       Init();
    </script>
</body>
</html>
