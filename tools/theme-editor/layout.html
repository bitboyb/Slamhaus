<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }

        .row {
            display: flex;
            gap: 20px;
        }

        .col {
            flex: 1;
        }

        iframe {
            border: 1px solid #ccc;
            background: white;
        }
    </style>
</head>

<body>
    <!-- Main Content from editor.slam injected here -->
    {{ content }}

    <!-- Editor Logic -->
    <script type="module">
        import { Init, SaveTheme } from './assets/editor.js';
        document.addEventListener('DOMContentLoaded', Init);
        document.getElementById('save-btn').addEventListener('click', SaveTheme);
    </script>
</body>

</html>
